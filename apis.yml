aid: yellowbrink
name: YellowBrink
description: >-
  YellowBrink is a Netherlands-based, vendor-neutral community platform for open health data,
  founded by Jan de Lange and Bouwe Koopal to connect healthcare professionals, vendors,
  researchers and policymakers working with open standards such as openEHR, HL7 FHIR, OMOP and
  SNOMED CT. The name pairs the Yellow Pages — showing who builds what — with "brink", the Dutch
  word for the village square where a community gathers. It runs weekly webinars in cooperation
  with openEHR NL, country and topic special-interest groups, and discussion and co-creation
  rooms, hosts "The Brink" partner and meeting area at the EHRCON26 conference in Amsterdam, and
  is developing a postdoctoral European Master of Data Availability programme with European
  universities and hospital systems. The platform is a white-labelled Innoloft LoftOS tenant;
  YellowBrink itself publishes no public API, SDK or developer program.
